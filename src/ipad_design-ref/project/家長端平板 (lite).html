<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>影子貨幣錢包 · 家長端（平板）</title>
<link rel="stylesheet" href="tablet-theme-lite.css">
<style>
  html, body { margin: 0; padding: 0; min-height: 100vh; }
  body {
    font-family: var(--t-sans);
    background: #14130F;
    color: var(--t-ink);
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    box-sizing: border-box;
  }
  #stage-wrap {
    width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  #stage {
    transform-origin: center center;
    flex: none;
  }
  /* —— iPad-ish bezel —— */
  .bezel {
    width: 1402px;
    height: 1060px;
    border-radius: 28px;
    background: linear-gradient(180deg, #2a2722 0%, #181613 100%);
    padding: 18px;
    box-shadow:
      0 40px 120px -30px rgba(0,0,0,0.55),
      0 0 0 1px rgba(0,0,0,0.4),
      inset 0 0 0 1px rgba(255,255,255,0.04);
    position: relative;
  }
  .bezel::before {
    /* subtle camera dot */
    content: ""; position: absolute;
    top: 18px; left: 50%; transform: translateX(-50%);
    width: 6px; height: 6px; border-radius: 50%;
    background: #0a0907; opacity: 0.7;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.04);
  }
  .screen {
    width: 1366px; height: 1024px;
    border-radius: 12px;
    overflow: hidden;
    background: var(--t-paper);
    position: relative;
  }
</style>
</head>
<body>
<template id="__bundler_thumbnail" data-bg-color="#0F0E0C">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <rect width="1200" height="800" fill="#0F0E0C"/>
    <rect x="120" y="100" width="960" height="600" rx="32" fill="#1B1815" stroke="#2E2A24" stroke-width="2"/>
    <rect x="148" y="128" width="904" height="544" rx="14" fill="#FAF8F5"/>
    <rect x="184" y="170" width="56" height="56" rx="10" fill="#1B3A5C"/>
    <text x="212" y="210" text-anchor="middle" font-family="Newsreader, serif" font-weight="700" font-size="34" fill="#FAF8F5">S</text>
    <line x1="184" y1="270" x2="1016" y2="270" stroke="#E5DECF" stroke-width="2"/>
    <text x="184" y="330" font-family="Newsreader, serif" font-weight="600" font-size="40" fill="#1B1B1A">家長端 · 平板</text>
    <text x="184" y="372" font-family="Plus Jakarta Sans, sans-serif" font-size="20" fill="#807A6F">影子貨幣錢包 · Parent Tablet</text>
    <rect x="184" y="408" width="380" height="220" rx="14" fill="#FFFFFF" stroke="#E5DECF"/>
    <rect x="584" y="408" width="432" height="100" rx="14" fill="#FFFFFF" stroke="#E5DECF"/>
    <rect x="584" y="528" width="432" height="100" rx="14" fill="#FBEFDF" stroke="#F0D5AE"/>
    <circle cx="980" cy="450" r="20" fill="#E8934A"/>
  </svg>
</template>
<div id="stage-wrap">
  <div id="stage">
    <div class="bezel">
      <div class="screen" id="root"></div>
    </div>
  </div>
</div>

<script>
  // Auto-fit the tablet bezel to the viewport.
  (function () {
    const W = 1402, H = 1060;
    function fit() {
      const stage = document.getElementById('stage');
      const wrap  = document.getElementById('stage-wrap');
      if (!stage || !wrap) return;
      const padding = 32;
      const sw = wrap.clientWidth  - padding;
      const sh = wrap.clientHeight - padding;
      const scale = Math.min(sw / W, sh / H, 1);
      stage.style.transform = `scale(${scale})`;
    }
    window.addEventListener('resize', fit);
    window.addEventListener('load', fit);
    setTimeout(fit, 50);
    setTimeout(fit, 300);
  })();
</script>
