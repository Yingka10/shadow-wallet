<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>任務卡片 v2</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #FFF0DC;
  display: flex; justify-content: center;
  padding: 40px 16px 60px;
  font-family: 'Noto Sans TC', 'PingFang TC', sans-serif;
  min-height: 100vh;
}
.wrap {
  width: 360px; display: flex; flex-direction: column; gap: 32px;
}

/* Section label */
.section-label {
  font-size: 11px; font-weight: 500; color: #9A7B5A;
  letter-spacing: 0.08em; margin-bottom: 12px;
  display: flex; align-items: center; gap: 8px;
}
.section-label::after {
  content: ''; flex: 1; height: 1px; background: rgba(95,60,30,0.12);
}

/* ── Base card ── */
.task-card {
  background: #FFF8EE;
  border-radius: 18px;
  border: none; box-shadow: 0 6px 18px -8px rgba(95,60,30,0.12);
  padding: 14px 14px 14px 18px;
  position: relative;
  overflow: hidden;
  transition: transform 0.15s, box-shadow 0.15s;
  cursor: default;
}
.task-card:active { transform: scale(0.985); }

/* Left accent bar */
.task-card::before {
  content: '';
  position: absolute; left: 0; top: 0; bottom: 0;
  width: 5px;
}
/* Pending: subtle warm grey */
.card-pending::before  { background: linear-gradient(180deg, #d8c898, #c8b880); }
/* Instant: orange */
.card-instant::before  { background: linear-gradient(180deg, #F08C6A, #D9744F); }
/* Weekly: green */
.card-weekly::before   { background: linear-gradient(180deg, #72c050, #4a9a30); }

/* Pending: muted overall */
.card-pending { background: #FFF8EE; opacity: 0.85; }

/* ── Top row ── */
.card-top {
  display: flex; align-items: center;
  justify-content: space-between; gap: 10px;
  margin-bottom: 10px;
}
.card-left { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }

.card-icon {
  width: 40px; height: 40px; border-radius: 13px;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; flex-shrink: 0;
}
.card-pending .card-icon  { background: rgba(180,165,100,0.12); }
.card-instant .card-icon  { background: rgba(245,168,48,0.14); }
.card-weekly  .card-icon  { background: rgba(90,170,64,0.13); }

.card-text { flex: 1; min-width: 0; }
.card-name {
  font-size: 15px; font-weight: 700; color: #3B2A1E;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  margin-bottom: 3px;
}
.card-pending .card-name { color: #6a5a38; }
.card-type {
  font-size: 11px; color: #b09870;
  display: flex; align-items: center; gap: 4px;
}
.type-dot {
  width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0;
}
.card-instant .type-dot { background: #f0a030; }
.card-weekly  .type-dot { background: #5aaa40; }
.card-pending .type-dot { background: #b8a870; }

.card-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

/* Coin chip */
.coin-chip {
  display: inline-flex; align-items: center; gap: 4px;
  border-radius: 10px; padding: 4px 10px;
  font-size: 13px; font-weight: 700;
}
.coin-chip.orange { background: #fff0c8; border: 1px solid #f0cc70; color: #B87A00; }
.coin-chip.green  { background: #e8f8d8; border: 1px solid #90d870; color: #3a8020; }
.coin-chip.grey   { background: #FFF0DC; border: 1px solid #d8d0b0; color: #9a9070; font-style: italic; }

/* More button */
.more-btn {
  width: 28px; height: 28px; border-radius: 50%;
  background: transparent; border: none;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: #c0aa80; font-size: 16px;
  transition: background 0.15s;
  flex-shrink: 0;
}
.more-btn:hover { background: #f0e8d0; }

/* ── Divider ── */
.card-divider {
  height: 1px; background: #f0e2b8;
  margin: 0 0 10px;
}

/* ── Pending hint ── */
.pending-hint {
  display: flex; align-items: flex-start; gap: 7px;
  background: #FFF0DC; border-radius: 10px;
  border: 1px dashed rgba(95,60,30,0.20);
  padding: 8px 10px;
  font-size: 11px; color: #9a8848; line-height: 1.55;
}
.pending-hint i { font-size: 14px; color: #F08C6A; flex-shrink: 0; margin-top: 0px; }

/* ── Deadline row (instant) ── */
.deadline-row {
  display: flex; align-items: center; gap: 7px;
  margin-bottom: 12px;
}
.deadline-row i { font-size: 15px; color: #c09050; flex-shrink: 0; }
.deadline-text { font-size: 12px; color: #9a7840; }
.deadline-text.urgent {
  color: #c84828; font-weight: 500;
}
.deadline-tag {
  margin-left: auto; flex-shrink: 0;
  font-size: 10px; padding: 2px 8px; border-radius: 8px;
  font-weight: 500;
}
.deadline-tag.ok     { background: rgba(100,180,80,0.10); color: #2d6b32; border: 1px solid rgba(100,180,80,0.25); }
.deadline-tag.warn   { background: #fff0d0; color: #B87A00; border: 1px solid #f0cc70; }
.deadline-tag.urgent { background: rgba(240,140,106,0.12); color: #D9744F; border: 1px solid rgba(240,140,106,0.30); }

/* ── Weekly cadence row ── */
.cadence-row {
  display: flex; align-items: center; gap: 6px;
  margin-bottom: 12px;
}
.cadence-row i { font-size: 15px; color: #70aa50; flex-shrink: 0; }
.cadence-text { font-size: 12px; color: #5a8040; }

/* ── Complete button ── */
.complete-btn {
  width: 100%; padding: 10px;
  border-radius: 13px; border: none;
  font-size: 13px; font-weight: 700;
  font-family: inherit; cursor: pointer;
  transition: transform 0.13s, opacity 0.13s;
  letter-spacing: 0.02em;
}
.complete-btn:active { transform: scale(0.96); opacity: 0.88; }
.complete-btn.orange {
  background: linear-gradient(135deg, #f5a830 0%, #e07820 100%);
  color: #fff;
  box-shadow: 0 3px 12px rgba(224,120,32,0.28);
}
.complete-btn.green {
  background: linear-gradient(135deg, #72c050 0%, #4a9a30 100%);
  color: #fff;
  box-shadow: 0 3px 12px rgba(80,154,48,0.28);
}
.complete-btn.done-state {
  background: #edf8e0; color: #4a8a28;
  box-shadow: none; cursor: default;
  border: 1.5px solid #b0da88;
}
</style>
</head>
<body>
<div class="wrap">

  <!-- ══ 1. 等待確認 ══ -->
  <div>
    <div class="section-label">等待爸媽確認</div>

    <div class="task-card card-pending">
      <div class="card-top">
        <div class="card-left">
          <div class="card-icon">🧺</div>
          <div class="card-text">
            <div class="card-name">幫媽媽晾衣服</div>
            <div class="card-type">
              <div class="type-dot"></div>即時任務
            </div>
          </div>
        </div>
        <div class="card-right">
          <div class="coin-chip grey">🌟 待定</div>
          <button class="more-btn" title="更多選項">
            <i class="ti ti-dots" aria-hidden="true"></i>
          </button>
        </div>
      </div>
      <div class="card-divider"></div>
      <div class="pending-hint">
        <i class="ti ti-clock-hour-4"></i>
        爸爸媽媽還沒確認，確認後就會出現在你的任務清單！
      </div>
    </div>

    <div class="task-card card-pending" style="margin-top:10px;">
      <div class="card-top">
        <div class="card-left">
          <div class="card-icon">🎹</div>
          <div class="card-text">
            <div class="card-name">練習鋼琴 15 分鐘</div>
            <div class="card-type">
              <div class="type-dot"></div>週期任務
            </div>
          </div>
        </div>
        <div class="card-right">
          <div class="coin-chip grey">🌟 待定</div>
          <button class="more-btn" title="更多選項">
            <i class="ti ti-dots" aria-hidden="true"></i>
          </button>
        </div>
      </div>
      <div class="card-divider"></div>
      <div class="pending-hint">
        <i class="ti ti-clock-hour-4"></i>
        爸爸媽媽還沒確認，確認後每週都會自動提醒你！
      </div>
    </div>
  </div>

  <!-- ══ 2. 即時任務 ══ -->
  <div>
    <div class="section-label">即時任務</div>

    <!-- 時間充裕 -->
    <div class="task-card card-instant">
      <div class="card-top">
        <div class="card-left">
          <div class="card-icon">🚗</div>
          <div class="card-text">
            <div class="card-name">幫爸爸洗車</div>
            <div class="card-type">
              <div class="type-dot"></div>即時任務
            </div>
          </div>
        </div>
        <div class="card-right">
          <div class="coin-chip orange">🌟 80</div>
          <button class="more-btn">
            <i class="ti ti-dots" aria-hidden="true"></i>
          </button>
        </div>
      </div>
      <div class="card-divider"></div>
      <div class="deadline-row">
        <i class="ti ti-calendar-due"></i>
        <div class="deadline-text">6月5日（週四）截止</div>
        <div class="deadline-tag ok">還有 4 天</div>
      </div>
      <button class="complete-btn orange" onclick="markDone(this)">完成了！✓</button>
    </div>

    <!-- 快截止 -->
    <div class="task-card card-instant" style="margin-top:10px;">
      <div class="card-top">
        <div class="card-left">
          <div class="card-icon">📚</div>
          <div class="card-text">
            <div class="card-name">整理我的書桌</div>
            <div class="card-type">
              <div class="type-dot"></div>即時任務
            </div>
          </div>
        </div>
        <div class="card-right">
          <div class="coin-chip orange">🌟 50</div>
          <button class="more-btn">
            <i class="ti ti-dots" aria-hidden="true"></i>
          </button>
        </div>
      </div>
      <div class="card-divider"></div>
      <div class="deadline-row">
        <i class="ti ti-alert-circle" style="color:#c84828;"></i>
        <div class="deadline-text urgent">今天截止，快去完成吧！</div>
        <div class="deadline-tag urgent">今天</div>
      </div>
      <button class="complete-btn orange" onclick="markDone(this)">完成了！✓</button>
    </div>
  </div>

  <!-- ══ 3. 週期任務 ══ -->
  <div>
    <div class="section-label">週期任務</div>

    <!-- 今天是執行日 -->
    <div class="task-card card-weekly">
      <div class="card-top">
        <div class="card-left">
          <div class="card-icon">🐕</div>
          <div class="card-text">
            <div class="card-name">遛狗 20 分鐘</div>
            <div class="card-type">
              <div class="type-dot"></div>週期任務
            </div>
          </div>
        </div>
        <div class="card-right">
          <div class="coin-chip green">🌟 40</div>
          <button class="more-btn">
            <i class="ti ti-dots" aria-hidden="true"></i>
          </button>
        </div>
      </div>
      <div class="card-divider"></div>
      <div class="cadence-row">
        <i class="ti ti-repeat"></i>
        <div class="cadence-text">每週一、三、五</div>
      </div>
      <button class="complete-btn green" onclick="markDone(this)">今天完成了！✓</button>
    </div>

  </div>

</div>

<script>
function markDone(btn) {
  const card = btn.closest('.task-card');

  /* Coin burst */
  const rect = btn.getBoundingClientRect();
  for (let i = 0; i < 12; i++) {
    const s = document.createElement('div');
    const angle = (i / 12) * Math.PI * 2;
    const isGreen = card.classList.contains('card-weekly');
    s.style.cssText = `
      position:fixed;width:7px;height:7px;border-radius:50%;
      background:${isGreen ? 'hsl(100,70%,50%)' : 'hsl(38,90%,55%)'};
      z-index:999;left:${rect.left + rect.width/2}px;top:${rect.top + rect.height/2}px;
      pointer-events:none;opacity:1;
      transition:transform 0.75s cubic-bezier(0.22,1,0.36,1),opacity 0.5s ease-in 0.25s;
    `;
    document.body.appendChild(s);
    const dist = 45 + Math.random() * 35;
    setTimeout(() => {
      s.style.transform = `translate(${Math.cos(angle)*dist}px,${Math.sin(angle)*dist - 20}px) scale(0.15)`;
      s.style.opacity = '0';
      setTimeout(() => s.remove(), 900);
    }, 20);
  }

  /* Button → done state */
  btn.classList.remove('orange','green');
  btn.classList.add('done-state');
  btn.textContent = '✓ 完成！幣已入帳';
  btn.disabled = true;

  /* Fade card */
  setTimeout(() => {
    card.style.transition = 'opacity 0.5s';
    card.style.opacity = '0.55';
  }, 600);
}
</script>
</body>
</html>
