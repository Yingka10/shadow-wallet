
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
.phone {
  width: 360px; margin: 0 auto;
  border-radius: 32px;
  border: 0.5px solid rgba(95,60,30,0.15);
  overflow: hidden; height: 720px;
  position: relative; background: #FFF8EE;
  font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
}

.leaf-particle {
  position: absolute; pointer-events: none;
  border-radius: 50% 0 50% 0; opacity: 0;
  animation: floatLeaf linear infinite;
}
@keyframes floatLeaf {
  0% { transform: translateY(0) rotate(0deg); opacity: 0; }
  10% { opacity: 0.5; } 90% { opacity: 0.25; }
  100% { transform: translateY(-200px) rotate(130deg); opacity: 0; }
}

.tree-section {
  background: linear-gradient(180deg, #FFF8EE 0%, #FFF0DC 100%);
  padding: 20px 24px 16px;
  display: flex; flex-direction: column; align-items: center;
  position: relative; overflow: hidden;
  border-bottom: 1px solid rgba(95,60,30,0.10);
  margin-bottom: 4px;
}
.tree-wrap {
  width: 130px; height: 130px; position: relative;
  cursor: pointer; transition: transform 0.25s ease;
  display: flex; align-items: center; justify-content: center;
}
.tree-wrap:hover { transform: scale(1.05); }
.tree-glow {
  position: absolute; inset: -14px; border-radius: 50%;
  background: radial-gradient(circle, rgba(160,220,80,0.15) 0%, transparent 70%);
  animation: treeGlowPulse 3.5s ease-in-out infinite; pointer-events: none;
}
@keyframes treeGlowPulse {
  0%,100% { opacity:0.4; transform:scale(0.92); }
  50% { opacity:1; transform:scale(1.08); }
}
/* Canvas replaces img tag for tree - no black bg */
.tree-canvas { display:block; }

.tree-label { font-size:13px; color:#3B2A1E; letter-spacing:0.08em; margin-bottom:2px; font-weight:500; }
.tree-hint { font-size:11px; color:#9A7B5A; margin-bottom:12px; }
.wish-btn {
  padding:9px 26px; border-radius:24px;
  background:rgba(240,140,106,0.12); border:1px solid rgba(240,140,106,0.35);
  color:#D9744F; font-size:13px; font-family:inherit; cursor:pointer; transition:background 0.15s;
}
.wish-btn:hover { background:rgba(240,140,106,0.22); }
.pebble { position:absolute; border-radius:50%; background:rgba(160,200,80,0.12); pointer-events:none; }

.list-section {
  flex:1; background:#FFF8EE; padding:12px 0 0;
  display:flex; flex-direction:column; height:calc(720px - 278px);
}
.section-coins { display:flex; align-items:center; justify-content:flex-end; padding:0 16px 8px; gap:6px; }
.coins-label { font-size:11px; color:#9A7B5A; }
.coins-val { font-size:13px; font-weight:500; color:#B87A00; }
.tabs { display:flex; gap:8px; padding:0 16px; margin-bottom:12px; }
.tab {
  flex:1; padding:6px 0; border-radius:20px; font-size:12px;
  text-align:center; cursor:pointer; border:0.5px solid transparent;
  color:#9a8a70; background:transparent; font-family:inherit; transition:all 0.15s;
}
.tab.active { background:rgba(240,140,106,0.10); border-color:rgba(240,140,106,0.30); color:#D9744F; }
.cards { flex:1; padding:0 16px; display:flex; flex-direction:column; gap:8px; overflow-y:auto; }
.card {
  background:#FFFFFF; border-radius:16px; box-shadow:0 6px 18px -8px rgba(95,60,30,0.14); border:none;
  padding:10px 12px; display:flex; flex-direction:column;
  transition:opacity 0.3s, border-color 0.3s;
}
.card.disabled { opacity:0.45; } .card.waiting { box-shadow:0 6px 18px -8px rgba(95,60,30,0.08); }
.card.active-privilege { box-shadow:0 6px 18px -8px rgba(240,140,106,0.28); }
.card-info { flex:1; } .card-name { font-size:13px; color:#3B2A1E; font-weight:500; margin-bottom:3px; }
.card-sub { font-size:11px; color:#9A7B5A; }
.card-top-row { display:flex; align-items:center; justify-content:space-between; width:100%; }
.card-right { display:flex; flex-direction:column; align-items:flex-end; gap:4px; flex-shrink:0; margin-left:8px; }
.coin-badge { font-size:11px; font-weight:500; color:#B87A00; background:rgba(245,184,0,0.12); border-radius:10px; padding:2px 8px; }
.coin-badge.dim { color:#C4A882; background:rgba(180,150,80,0.08); }
.shortage { font-size:10px; color:#C4A882; }
.tag-wait { font-size:10px; border-radius:8px; padding:2px 7px; background:rgba(245,184,0,0.10); color:#B87A00; border:0.5px solid rgba(245,184,0,0.25); }
.tag-active { font-size:10px; border-radius:8px; padding:2px 7px; background:rgba(240,140,106,0.10); color:#D9744F; border:0.5px solid rgba(240,140,106,0.28); }
.btn-redeem { font-size:11px; padding:4px 10px; border-radius:12px; background:rgba(240,140,106,0.10); border:0.5px solid rgba(240,140,106,0.30); color:#D9744F; cursor:pointer; font-family:inherit; white-space:nowrap; }
.btn-redeem:hover { background:rgba(240,140,106,0.20); }
.btn-end { font-size:11px; padding:4px 10px; border-radius:12px; background:rgba(80,160,80,0.12); border:0.5px solid rgba(80,160,80,0.28); color:#2d6b32; cursor:pointer; font-family:inherit; white-space:nowrap; }
.btn-end:hover { background:rgba(80,160,80,0.20); }
.btn-end-full { width:100%; margin-top:8px; padding:9px; border-radius:12px;
  background:rgba(240,140,106,0.10); border:0.5px solid rgba(240,140,106,0.30);
  color:#D9744F; font-size:12px; font-weight:500; font-family:inherit;
  cursor:pointer; transition:background 0.15s; }
.btn-end-full:hover { background:rgba(240,140,106,0.20); }

.bottom-nav { background:#FFF0DC; border-top:0.5px solid rgba(95,60,30,0.10); display:flex; padding:10px 0 16px; }
.nav-item { flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer; }
.nav-item i { font-size:22px; color:#C4A882; } .nav-item.active i { color:#F08C6A; }
.nav-item span { font-size:10px; color:#C4A882; } .nav-item.active span { color:#F08C6A; }

#ripple-canvas { position:absolute; inset:0; pointer-events:none; z-index:10; border-radius:32px; }
#firefly-canvas { position:absolute; inset:0; pointer-events:none; z-index:8; border-radius:32px; }

#page-wish {
  position:absolute; inset:0; background:#FFF8EE;
  display:flex; flex-direction:column;
  opacity:0; pointer-events:none; z-index:5; overflow:hidden;
}
#page-wish.visible { opacity:1; pointer-events:all; }

.wish-bubble {
  position:absolute; border-radius:50%;
  background:rgba(140,190,60,0.07); border:0.5px solid rgba(140,190,60,0.10);
  pointer-events:none; animation:driftBubble ease-in-out infinite;
}
@keyframes driftBubble {
  0%,100% { transform:translateY(0) scale(1); opacity:0.5; }
  50% { transform:translateY(-14px) scale(1.04); opacity:0.9; }
}

.wish-top {
  padding:20px 20px 0; display:flex; align-items:center; justify-content:space-between;
  position:relative; z-index:2;
}
.close-btn {
  width:32px; height:32px; border-radius:50%;
  background:rgba(240,140,106,0.10); border:0.5px solid rgba(240,140,106,0.20);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; color:#D9744F; font-size:16px;
}
.wish-top-hint { font-size:11px; color:#9A7B5A; letter-spacing:0.06em; }

.big-tree-wrap {
  display:flex; flex-direction:column; align-items:center;
  padding:10px 0 6px; position:relative; z-index:2;
}
.big-tree-outer {
  position:relative; width:190px; height:190px;
  display:flex; align-items:center; justify-content:center;
  animation:treeEnter 0.7s cubic-bezier(0.22,1,0.36,1) both, treeBob 4s ease-in-out 0.7s infinite;
}
@keyframes treeEnter {
  0% { transform:scale(0.55) translateY(24px); opacity:0; }
  100% { transform:scale(1) translateY(0); opacity:1; }
}
@keyframes treeBob {
  0%,100% { transform:translateY(0) rotate(-0.4deg); }
  50% { transform:translateY(-7px) rotate(0.4deg); }
}

.tree-halo {
  position:absolute; bottom:-4px; width:130px; height:30px; border-radius:50%;
  background:radial-gradient(ellipse, rgba(140,200,60,0.20) 0%, transparent 70%);
  animation:haloBreath 3.2s ease-in-out infinite; pointer-events:none;
}
@keyframes haloBreath {
  0%,100% { opacity:0.4; transform:scaleX(0.9); }
  50% { opacity:1; transform:scaleX(1.14); }
}
.big-tree-outer.listening .tree-halo {
  animation:haloPulse 0.85s ease-in-out infinite;
  background:radial-gradient(ellipse, rgba(140,220,60,0.50) 0%, transparent 70%);
}
@keyframes haloPulse {
  0%,100% { opacity:0.55; transform:scaleX(0.82) scaleY(0.75); }
  50% { opacity:1; transform:scaleX(1.35) scaleY(1.25); }
}
.big-tree-outer.glowing .tree-halo {
  animation:haloGlow 0.4s ease-in-out infinite;
  background:radial-gradient(ellipse, rgba(245,184,0,0.65) 0%, transparent 70%);
  width:170px; height:50px;
}
@keyframes haloGlow {
  0%,100% { opacity:0.8; transform:scaleX(1.1); }
  50% { opacity:1; transform:scaleX(1.5); }
}

/* Big tree drawn via canvas - no black bg */
#big-tree-canvas { display:block; position:relative; z-index:1; }

.big-tree-status { font-size:12px; color:#9A7B5A; letter-spacing:0.06em; position:relative; z-index:2; margin-top:4px; }

.dialog-area {
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:0 32px; position:relative; z-index:2;
}
.dialog-text { font-size:15px; color:#3B2A1E; text-align:center; line-height:1.75; transition:opacity 0.4s; }
.dialog-text.child-text { color:#7A5C44; font-size:14px; }

.confirm-box {
  margin:0 20px 8px; background:rgba(240,140,106,0.05);
  border:0.5px solid rgba(240,140,106,0.18); border-radius:12px;
  padding:12px 14px; display:none; position:relative; z-index:2;
}
.confirm-box.show { display:block; }
.confirm-label { font-size:11px; color:#8a9050; margin-bottom:6px; }
.confirm-text-val { font-size:13px; color:#4a3a20; margin-bottom:10px; }
.confirm-btns { display:flex; gap:8px; }
.cbtn { flex:1; padding:8px 0; border-radius:20px; font-size:12px; font-family:inherit; cursor:pointer; text-align:center; }
.cbtn-yes { background:rgba(240,140,106,0.12); border:0.5px solid rgba(240,140,106,0.35); color:#D9744F; }
.cbtn-no { background:transparent; border:0.5px solid rgba(160,140,80,0.18); color:#9a8060; }

.voice-area {
  padding:8px 20px 22px; display:flex; align-items:center; gap:14px;
  position:relative; z-index:2;
}
.voice-btn {
  width:58px; height:58px; border-radius:50%;
  background:rgba(240,140,106,0.10); border:1px solid rgba(240,140,106,0.28);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; flex-shrink:0; transition:background 0.2s, border-color 0.2s;
}
.voice-btn.pressing { background:rgba(240,140,106,0.28); border-color:rgba(240,140,106,0.60); }
.voice-btn i { font-size:24px; color:#F08C6A; }
.voice-hint { font-size:11px; color:#9a9060; line-height:1.6; }
</style>

<script>
/* ── Cards ── */
const cardsData = {
  privilege:[
    {name:'多30分鐘3C時間',sub:'立即生效',cost:20,canAfford:true,status:'normal',repeatable:true},
    {name:'決定今晚吃什麼',sub:'立即生效',cost:15,canAfford:true,status:'active',repeatable:true},
    {name:'晚睡一小時',sub:'立即生效',cost:30,canAfford:true,status:'normal',repeatable:true},
    {name:'選這週的家庭電影',sub:'立即生效',cost:50,canAfford:false,status:'normal',repeatable:true},
  ],
  item:[
    {name:'星際大戰樂高套組',sub:'家長協助完成',cost:80,canAfford:false,status:'normal',repeatable:false},
    {name:'新的故事書',sub:'家長協助完成',cost:25,canAfford:true,status:'waiting',repeatable:false},
    {name:'一包最愛的零食',sub:'家長協助完成',cost:10,canAfford:true,status:'normal',repeatable:true},
  ],
  experience:[]
};
let currentTab='privilege';
function renderCards(tab){
  const c=document.getElementById('cards-container'); c.innerHTML='';
  cardsData[tab].forEach((card,i)=>{
    const el=document.createElement('div');
    el.className='card'+(!card.canAfford?' disabled':'')+(card.status==='waiting'?' waiting':'')+(card.status==='active'?' active-privilege':'');
    let r='';
    const bc=card.canAfford?'coin-badge':'coin-badge dim';
    r+=`<div class="${bc}">🪙 ${card.cost}</div>`;
    if(!card.canAfford) r+=`<div class="shortage">還差 ${card.cost-42} 星幣</div>`;
    else if(card.status==='waiting') r+=`<div class="tag-wait">等待中</div>`;
    else if(card.status==='active'){r+=`<div class="tag-active">使用中</div>`;}
    else if(card.canAfford) r+=`<button class="btn-redeem" data-tab="${tab}" data-idx="${i}">兌換</button>`;
    const isActive = card.status === 'active';
    if (isActive) {
      el.innerHTML=`<div class="card-top-row"><div class="card-info"><div class="card-name">${card.name}</div><div class="card-sub">${card.sub}</div></div><div class="card-right">${r}</div></div><button class="btn-end-full" data-tab="${tab}" data-idx="${i}">結束使用</button>`;
    } else {
      el.innerHTML=`<div class="card-top-row"><div class="card-info"><div class="card-name">${card.name}</div><div class="card-sub">${card.sub}</div></div><div class="card-right">${r}</div></div>`;
    }
    c.appendChild(el);
  });
  c.querySelectorAll('.btn-redeem').forEach(b=>b.addEventListener('click',()=>{
    const t=b.dataset.tab,idx=parseInt(b.dataset.idx);
    cardsData[t][idx].status=t==='privilege'?'active':'waiting'; renderCards(currentTab);
  }));
  c.querySelectorAll('.btn-end').forEach(b=>b.addEventListener('click',()=>{
    cardsData[b.dataset.tab][parseInt(b.dataset.idx)].status='normal'; renderCards(currentTab);
  }));
  c.querySelectorAll('.btn-end-full').forEach(b=>b.addEventListener('click',()=>{
    cardsData[b.dataset.tab][parseInt(b.dataset.idx)].status='normal'; renderCards(currentTab);
  }));
}
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  t.classList.add('active'); currentTab=t.dataset.tab; renderCards(currentTab);
}));

let treeImageData = null;

function loadTreeImage(callback) {
  if (treeImageData) { callback(treeImageData); return; }
  const img = new Image();
  img.onload = function() {
    const offscreen = document.createElement('canvas');
    offscreen.width = img.width; offscreen.height = img.height;
    const octx = offscreen.getContext('2d');
    octx.drawImage(img, 0, 0);
    const raw = octx.getImageData(0, 0, img.width, img.height);
    /* Remove dark pixels: if r+g+b < 60 and all channels close, make transparent */
    const d = raw.data;
    for (let i = 0; i < d.length; i += 4) {
      const r=d[i], g=d[i+1], b=d[i+2];
      const brightness = r + g + b;
      /* Pure dark / near-black pixels → fully transparent */
      if (brightness < 80 && Math.max(r,g,b) - Math.min(r,g,b) < 30) {
        d[i+3] = 0;
      } else if (brightness < 140 && Math.max(r,g,b) - Math.min(r,g,b) < 40) {
        /* Semi-dark edge → partial transparency for smooth edge */
        d[i+3] = Math.round(d[i+3] * ((brightness - 80) / 60));
      }
    }
    treeImageData = raw;
    callback(raw);
  };
  img.src = TREE_SRC;
}

function drawTreeOnCanvas(canvas, size) {
  loadTreeImage(function(raw) {
    const offscreen = document.createElement('canvas');
    offscreen.width = raw.width; offscreen.height = raw.height;
    const octx = offscreen.getContext('2d');
    octx.putImageData(raw, 0, 0);
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, size, size);
    ctx.drawImage(offscreen, 0, 0, size, size);
  });
}

/* Draw trees once DOM ready */
setTimeout(() => {
  drawTreeOnCanvas(document.getElementById('main-tree-canvas'), 130);
  drawTreeOnCanvas(document.getElementById('big-tree-canvas'), 180);
}, 100);

/* ── Firefly system ── */
const ffCanvas = document.getElementById('firefly-canvas');
const ffCtx = ffCanvas.getContext('2d');

/* Firefly state: 'idle' | 'listening' | 'off' */
let ffState = 'off';
let fireflies = [];
let ffRAF = null;

const FF_IDLE_COUNT = 6;
const FF_LISTEN_COUNT = 20;
/* Tree crown center on wish page */
const FF_CX = 180, FF_CY = 158;

function makeFirefly(state) {
  const angle = Math.random() * Math.PI * 2;
  const r = state === 'listening' ? 30 + Math.random() * 55 : 50 + Math.random() * 60;
  return {
    x: FF_CX + Math.cos(angle) * r,
    y: FF_CY + Math.sin(angle) * r,
    /* orbit params */
    orbitAngle: angle,
    orbitR: r,
    orbitSpeed: (Math.random() > 0.5 ? 1 : -1) * (state === 'listening' ? 0.018 + Math.random() * 0.014 : 0.005 + Math.random() * 0.006),
    /* blink */
    phase: Math.random() * Math.PI * 2,
    blinkSpeed: state === 'listening' ? 0.06 + Math.random() * 0.06 : 0.025 + Math.random() * 0.02,
    maxAlpha: state === 'listening' ? 0.80 + Math.random() * 0.20 : 0.30 + Math.random() * 0.20,
    size: state === 'listening' ? 2.2 + Math.random() * 1.8 : 1.2 + Math.random() * 1.0,
    hue: 35 + Math.random() * 30,
  };
}

function setFireflyState(state) {
  ffState = state;
  if (state === 'off') { fireflies = []; return; }
  const target = state === 'listening' ? FF_LISTEN_COUNT : FF_IDLE_COUNT;
  /* Remove excess smoothly by just trimming */
  if (fireflies.length > target) fireflies = fireflies.slice(0, target);
  /* Add new ones with correct params */
  while (fireflies.length < target) fireflies.push(makeFirefly(state));
  /* Re-tune existing ones to new state speed/brightness */
  fireflies.forEach(f => {
    const isListening = state === 'listening';
    f.blinkSpeed = isListening ? 0.06 + Math.random()*0.06 : 0.025 + Math.random()*0.02;
    f.maxAlpha   = isListening ? 0.80 + Math.random()*0.20 : 0.30 + Math.random()*0.20;
    f.size       = isListening ? 2.2 + Math.random()*1.8   : 1.2 + Math.random()*1.0;
    f.orbitSpeed = (f.orbitSpeed > 0 ? 1 : -1) * (isListening ? 0.018 + Math.random()*0.014 : 0.005 + Math.random()*0.006);
    /* Tighten orbit radius when listening */
    if (isListening && f.orbitR > 80) f.orbitR = 30 + Math.random() * 55;
  });
  if (!ffRAF) ffRAF = requestAnimationFrame(tickFF);
}

function tickFF() {
  ffCtx.clearRect(0, 0, 360, 720);
  if (ffState === 'off') { ffRAF = null; return; }
  fireflies.forEach(f => {
    f.orbitAngle += f.orbitSpeed;
    f.x = FF_CX + Math.cos(f.orbitAngle) * f.orbitR;
    f.y = FF_CY + Math.sin(f.orbitAngle) * f.orbitR * 0.55;
    f.phase += f.blinkSpeed;
    const alpha = f.maxAlpha * (0.5 + 0.5 * Math.sin(f.phase));
    /* glow halo */
    const g = ffCtx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.size * 4);
    g.addColorStop(0, `hsla(${f.hue},85%,65%,${alpha * 0.8})`);
    g.addColorStop(1, `hsla(${f.hue},80%,55%,0)`);
    ffCtx.beginPath(); ffCtx.arc(f.x, f.y, f.size*4, 0, Math.PI*2);
    ffCtx.fillStyle = g; ffCtx.fill();
    /* bright core */
    ffCtx.beginPath(); ffCtx.arc(f.x, f.y, f.size*0.8, 0, Math.PI*2);
    ffCtx.fillStyle = `hsla(60,100%,94%,${alpha})`; ffCtx.fill();
  });
  ffRAF = requestAnimationFrame(tickFF);
}

/* ── Ripple canvas ── */
const rippleCanvas = document.getElementById('ripple-canvas');
const rCtx = rippleCanvas.getContext('2d');

function leafBurstRipple(reverse, callback) {
  const cx=180, cy=165, maxR=Math.sqrt(360*360+720*720)+10;
  let r = reverse ? maxR : 0;
  if (!reverse) {
    for (let i=0;i<14;i++) {
      const p=document.createElement('div');
      const angle=(i/14)*Math.PI*2, dist=55+Math.random()*40;
      p.style.cssText=`position:absolute;width:${4+Math.random()*5}px;height:${3+Math.random()*3}px;border-radius:50% 0 50% 0;background:hsl(${25+Math.random()*20},85%,62%);opacity:1;pointer-events:none;z-index:12;left:${cx}px;top:${cy}px;transition:transform 0.8s ease-out,opacity 0.8s ease-in;`;
      rippleCanvas.parentElement.appendChild(p);
      setTimeout(()=>{
        p.style.transform=`translate(${Math.cos(angle)*dist}px,${Math.sin(angle)*dist}px) rotate(${Math.random()*360}deg) scale(0.15)`;
        p.style.opacity='0'; setTimeout(()=>p.remove(),900);
      },20);
    }
  }
  function draw() {
    rCtx.clearRect(0,0,360,720);
    rCtx.beginPath(); rCtx.arc(cx,cy,r,0,Math.PI*2);
    const grad=rCtx.createRadialGradient(cx,cy,0,cx,cy,r);
    if(!reverse){grad.addColorStop(0,'#FFF0DC');grad.addColorStop(1,'#FFF8EE');}
    else{grad.addColorStop(0,'#FFF8EE');grad.addColorStop(1,'#FFF0DC');}
    rCtx.fillStyle=grad; rCtx.fill();
    r=reverse?r-20:r+20;
    const done=reverse?r<=0:r>=maxR;
    if(!done) requestAnimationFrame(draw);
    else{rCtx.clearRect(0,0,360,720); callback();}
  }
  draw();
}

/* ── Seed burst finale ── */
function seedBurstFinale(onDone) {
  const phone=document.getElementById('phone');
  const cx=180, cy=165, count=24;
  const seeds=[];
  for(let i=0;i<count;i++) {
    const angle=(i/count)*Math.PI*2 - Math.PI/2 + (Math.random()-0.5)*0.7;
    const speed=3.2+Math.random()*3.0;
    seeds.push({
      x:cx,y:cy, vx:Math.cos(angle)*speed, vy:Math.sin(angle)*speed-2.2,
      ay:-0.10, alpha:1, size:2.8+Math.random()*3.2,
      hue:25+Math.random()*25, trail:[],
    });
  }
  /* flash overlay */
  const flash=document.createElement('div');
  flash.style.cssText=`position:absolute;inset:0;border-radius:32px;background:rgba(240,140,106,0.45);z-index:20;pointer-events:none;transition:opacity 0.45s;`;
  phone.appendChild(flash);
  setTimeout(()=>{flash.style.opacity='0';setTimeout(()=>flash.remove(),500);},70);

  let frame=0; const total=90;
  function draw(){
    rCtx.clearRect(0,0,360,720);
    seeds.forEach(s=>{
      s.trail.push({x:s.x,y:s.y});
      if(s.trail.length>8) s.trail.shift();
      s.vy+=s.ay; s.x+=s.vx; s.y+=s.vy;
      s.alpha=Math.max(0,1-frame/total);
      s.trail.forEach((pt,ti)=>{
        const ta=(ti/s.trail.length)*s.alpha*0.45;
        rCtx.beginPath(); rCtx.arc(pt.x,pt.y,s.size*0.35*(ti/s.trail.length),0,Math.PI*2);
        rCtx.fillStyle=`hsla(${s.hue},90%,65%,${ta})`; rCtx.fill();
      });
      const g=rCtx.createRadialGradient(s.x,s.y,0,s.x,s.y,s.size*2.8);
      g.addColorStop(0,`hsla(${s.hue},95%,80%,${s.alpha})`);
      g.addColorStop(1,`hsla(${s.hue},80%,58%,0)`);
      rCtx.beginPath(); rCtx.arc(s.x,s.y,s.size*2.8,0,Math.PI*2);
      rCtx.fillStyle=g; rCtx.fill();
      rCtx.beginPath(); rCtx.arc(s.x,s.y,s.size*0.65,0,Math.PI*2);
      rCtx.fillStyle=`hsla(60,100%,97%,${s.alpha})`; rCtx.fill();
    });
    frame++;
    if(frame<total) requestAnimationFrame(draw);
    else{rCtx.clearRect(0,0,360,720); if(onDone) onDone();}
  }
  requestAnimationFrame(draw);
}

/* ── Conversation ── */
const pageWish=document.getElementById('page-wish');
const bigTreeOuter=document.getElementById('big-tree-outer');
const treeStatus=document.getElementById('tree-status');
const dialogText=document.getElementById('dialog-text');
const confirmBox=document.getElementById('confirm-box');
const confirmVal=document.getElementById('confirm-val');
const voiceBtn=document.getElementById('voice-btn');
const voiceHint=document.getElementById('voice-hint');

const conversation=[
  {role:'tree',text:'嗨！你今天想許什麼願望呢？跟我說說看吧 🌿'},
  {role:'child',text:'我想要一個新的樂高',confirm:'「新的樂高玩具」'},
  {role:'tree',text:'樂高！很棒的願望。你有特別想要哪一款嗎？'},
  {role:'child',text:'星際大戰那一款',confirm:'「星際大戰樂高套組」'},
  {role:'tree',text:'好的，我會把你的願望傳給爸爸媽媽，希望願望成真 ✨',final:true},
];
let step=0, animating=false;

function showText(text,isChild,onDone){
  dialogText.style.opacity='0';
  dialogText.className='dialog-text'+(isChild?' child-text':'');
  dialogText.textContent=text;
  setTimeout(()=>{
    dialogText.style.transition='opacity 0.5s'; dialogText.style.opacity='1';
    if(onDone) setTimeout(onDone,isChild?1800:2500);
  },100);
}
function fadeText(onDone){
  dialogText.style.transition='opacity 0.4s'; dialogText.style.opacity='0';
  setTimeout(onDone,450);
}

function finishWish(){
  treeStatus.textContent='願望已送出 ✨';
  bigTreeOuter.classList.remove('listening');
  bigTreeOuter.classList.add('glowing');
  setFireflyState('off');
  setTimeout(()=>{
    seedBurstFinale(()=>{
      bigTreeOuter.classList.remove('glowing');
      setTimeout(()=>{
        leafBurstRipple(true,()=>{
          pageWish.classList.remove('visible');
          resetWish();
        });
      },300);
    });
  },350);
}

function runStep(){
  if(step>=conversation.length) return;
  const s=conversation[step];
  if(s.role==='tree'){
    treeStatus.textContent='許願樹說⋯';
    bigTreeOuter.classList.remove('listening');
    setFireflyState('idle');
    showText(s.text,false,()=>{
      if(s.final){fadeText(()=>finishWish());return;}
      step++;
      if(step<conversation.length&&conversation[step].role==='child'){
        fadeText(()=>{
          treeStatus.textContent='請長按麥克風說話';
          dialogText.textContent=''; dialogText.style.opacity='1';
          voiceHint.innerHTML='長按麥克風說話<br>放開後許願樹會聆聽你說的話';
          animating=false;
        });
      }
    });
  }
}

function handlePress(){
  if(animating) return;
  const s=conversation[step];
  if(!s||s.role!=='child') return;
  animating=true;
  voiceBtn.classList.add('pressing');
  bigTreeOuter.classList.add('listening');
  treeStatus.textContent='許願樹正在聆聽⋯';
  setFireflyState('listening');
  voiceHint.innerHTML='放開後確認願望';
  setTimeout(()=>{
    voiceBtn.classList.remove('pressing');
    showText(s.text,true,()=>{
      fadeText(()=>{
        confirmVal.textContent=s.confirm; confirmBox.classList.add('show');
        treeStatus.textContent='請確認你的願望';
        bigTreeOuter.classList.remove('listening');
        setFireflyState('idle');
      });
    });
  },1000);
}

voiceBtn.addEventListener('mousedown',handlePress);
voiceBtn.addEventListener('touchstart',e=>{e.preventDefault();handlePress();});

document.getElementById('confirm-yes').addEventListener('click',()=>{
  confirmBox.classList.remove('show'); step++;
  setTimeout(()=>{animating=false;runStep();},300);
});
document.getElementById('confirm-no').addEventListener('click',()=>{
  confirmBox.classList.remove('show'); animating=false;
  treeStatus.textContent='請重新說一次';
  voiceHint.innerHTML='長按麥克風說話<br>放開後許願樹會聆聽你說的話';
});

function openWish(){
  step=0; animating=false;
  leafBurstRipple(false,()=>{
    pageWish.classList.add('visible');
    drawTreeOnCanvas(document.getElementById('big-tree-canvas'),180);
    setFireflyState('idle');
    setTimeout(runStep,200);
  });
}
function resetWish(){
  step=0; animating=false;
  setFireflyState('off');
  confirmBox.classList.remove('show');
  dialogText.textContent=''; dialogText.style.opacity='1';
  treeStatus.textContent='許願樹正在等待⋯';
  bigTreeOuter.className='big-tree-outer';
  voiceHint.innerHTML='長按麥克風說話<br>放開後許願樹會聆聽你說的話';
}

document.getElementById('wish-btn').addEventListener('click',openWish);
document.getElementById('main-tree').addEventListener('click',openWish);
document.getElementById('close-btn').addEventListener('click',()=>{
  pageWish.classList.remove('visible'); resetWish();
});
</script>
